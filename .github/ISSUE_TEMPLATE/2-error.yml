name: Error
description: Algo funciona mal o un cálculo da un resultado incorrecto.
title: "[Error] "
labels: ["error"]
body:
  - type: markdown
    attributes:
      value: |
        **No incluyas direcciones exactas, nombres, teléfonos ni claves.** Si el error depende de una dirección, indica solo la comuna.
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de error
      options:
        - Cálculo incorrecto (motor de costos)
        - Distancia o tiempo incorrectos
        - Peajes o combustible incorrectos
        - Interfaz o texto confuso
        - Otro
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado y resultado obtenido
      description: Si es un cálculo, indica el valor que esperabas y por qué.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión del motor y de los datos (si la app la muestra)
  - type: input
    id: dispositivo
    attributes:
      label: Dispositivo y navegador
      placeholder: "Ej.: Android, Chrome"
