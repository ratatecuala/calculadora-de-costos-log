name: Tarea
description: Trabajo concreto de desarrollo, documentación o datos.
title: "[E?] "
labels: ["funcionalidad"]
body:
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: Qué se quiere lograr y por qué.
    validations:
      required: true
  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      options:
        - P0 (bloqueante)
        - P1 (necesaria para la etapa)
        - P2 (deseable)
        - P3 (futuro)
    validations:
      required: true
  - type: dropdown
    id: etapa
    attributes:
      label: Etapa
      options: [E0, E1, E2, E3, E4, E5, Posterior a v1]
    validations:
      required: true
  - type: input
    id: dependencias
    attributes:
      label: Dependencias
      description: "Issues que deben cerrarse antes (por ejemplo, #8, #9)."
  - type: textarea
    id: tareas
    attributes:
      label: Tareas
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: Cómo sabremos que está terminado. Deben ser verificables.
    validations:
      required: true
